<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 260px; margin: 0; padding: 14px; font: 13px -apple-system, "Segoe UI", Roboto, sans-serif; color: #1f2937; }
    h1 { font-size: 14px; margin: 0 0 12px; display: flex; align-items: center; gap: 6px; }
    h1 span { width: 9px; height: 9px; border-radius: 50%; background: #10b981; }
    label { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid #eee; border-bottom: 1px solid #eee; }
    #status { margin-top: 12px; padding: 10px; border-radius: 6px; background: #f9fafb; font-size: 12px; color: #4b5563; }
    #status.dangerous { background: #fef2f2; color: #b91c1c; }
    #status.suspicious { background: #fffbeb; color: #92400e; }
    #status.safe { background: #f0fdf4; color: #047857; }
    #status b { display: block; margin-bottom: 4px; font-size: 12px; }
    .foot { margin-top: 10px; font-size: 11px; color: #9ca3af; text-align: center; }
  </style>
</head>
<body>
  <h1><span></span>PhishGuard</h1>
  <label><input type="checkbox" id="enabled"> Enable on Gmail</label>
  <div id="status">Open an email in Gmail to scan it.</div>
  <div class="foot">Runs locally · nothing leaves your browser</div>
  <script src="popup.js"></script>
</body>
</html>
